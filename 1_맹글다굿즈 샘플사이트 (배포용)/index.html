<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맹글다굿즈 제작 샘플</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
<style id="app-style">
/* 흰 바탕 + 귤색 포인트 / 사진이 주인공인 카탈로그 격자 + 상세 창(사진 | 주문 사양표) */
:root {
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#2a211b; --muted:#6f625a; --line:#efe6df;
  --accent:#ff8a1f; --accent-ink:#2a1500; --accent-soft:#fff2e5; --accent-text:#b4530a; --danger:#b42318;
  --veil:rgba(30,20,12,.55); --ph:#f7f2ee; --chip-bg:rgba(20,14,10,.66); --chip-ink:#ffffff;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html.locked { overflow:hidden; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.6; }
img { max-width:100%; }
.wrap { max-width:1120px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap:balance; }
.pre { white-space:pre-wrap; overflow-wrap:anywhere; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* 버튼 */
.btn { font:inherit; font-size:.9rem; padding:8px 14px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap; }
.btn:hover:not(:disabled) { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.btn.ghost { background:transparent; }
.btn.danger { color:var(--danger); border-color:var(--danger); background:transparent; }
.btn.danger.solid { background:var(--danger); color:var(--surface); }
.btn.tiny { font-size:.82rem; padding:4px 10px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, .drop:focus-within {
  outline:3px solid var(--accent); outline-offset:2px; }

/* 편집 막대 (내 컴퓨터에서 열었을 때만) */
.editbar { background:var(--accent-soft); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
.editbar-in { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding-block:10px; }
.editbar .mode { font-size:.88rem; color:var(--muted); }
.editbar .mode b { color:var(--ink); }
.editbar .dirty { color:var(--danger); font-weight:600; }
.editbar .clean { color:var(--accent-text); }
.editbar-actions { display:flex; flex-wrap:wrap; gap:8px; }

/* 머리말 */
.top { padding-block:44px 22px; }
.top h1 { font-family:var(--display); font-weight:700; font-size:clamp(1.9rem, 5vw, 2.7rem); line-height:1.2; margin:0; }
.top .intro { margin:10px 0 0; max-width:62ch; color:var(--muted); }
.contact { margin:16px 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.contact .k { font-size:.78rem; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 10px; }
.contact .v { font-weight:600; user-select:all; overflow-wrap:anywhere; }

/* 카카오톡 채널 문의 */
.kakao-row { margin:18px 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.kakao { display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:600; font-size:.95rem; text-decoration:none;
  background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); border-radius:999px; padding:10px 18px; }
a.kakao:hover { filter:brightness(.96); }
.kakao .bubble { width:18px; height:18px; flex:none; }
.owner-note { font-size:.85rem; color:var(--accent-text); margin:8px 0 0; }

/* 목록 */
.count { font-size:.85rem; color:var(--muted); border-top:1px solid var(--line); padding-block:14px 12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap:20px; padding-bottom:64px; }
.card { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:0; }
.card-hit { display:block; width:100%; padding:0; margin:0; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.card-hit:focus-visible { outline-offset:-3px; }
.ph { position:relative; aspect-ratio:4/5; background:var(--ph); display:grid; place-items:center; max-width:100%; }
.ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.noph { color:var(--muted); font-size:.85rem; }
.badge { position:absolute; left:10px; bottom:10px; background:var(--chip-bg); color:var(--chip-ink); font-size:.75rem; padding:2px 9px; border-radius:999px; }
.cbody { padding:14px 16px 16px; display:flex; flex-direction:column; gap:2px; }
.cbody h2 { font-family:var(--display); font-size:1.15rem; line-height:1.35; margin:0; overflow-wrap:anywhere; }
.price { font-weight:600; font-variant-numeric:tabular-nums; margin:0; }
.period { margin:0; color:var(--muted); font-size:.86rem; }
.card-tools { position:absolute; top:10px; right:10px; display:flex; gap:6px; }
.empty { border:1px dashed var(--line); border-radius:12px; padding:40px 20px; text-align:center; color:var(--muted); margin-bottom:64px; }
.empty .btn { margin-top:12px; }

/* 창 */
.veil { position:fixed; inset:0; z-index:50; background:var(--veil); display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { position:relative; background:var(--surface); color:var(--ink); border-radius:14px; width:min(100%, 1000px); max-height:100%; overflow:auto; outline:none; }
.x-close { position:absolute; top:10px; right:10px; z-index:3; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:1rem; cursor:pointer; }

/* 상세 */
.detail { display:grid; grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr); }
.gal { padding:16px; min-width:0; }
.stage { position:relative; aspect-ratio:1/1; background:var(--ph); border-radius:10px; overflow:hidden; display:grid; place-items:center; max-width:100%; }
.stage img { width:100%; height:100%; object-fit:contain; }
.nav { position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; border:0;
  background:var(--chip-bg); color:var(--chip-ink); font-size:1.1rem; cursor:pointer; }
.nav.prev { left:10px; } .nav.next { right:10px; }
.counter { position:absolute; right:10px; bottom:10px; background:var(--chip-bg); color:var(--chip-ink); font-size:.78rem;
  padding:2px 9px; border-radius:999px; font-variant-numeric:tabular-nums; }
.thumbs { display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px; }
.thumb { flex:none; width:64px; height:64px; padding:0; border:2px solid transparent; border-radius:8px; overflow:hidden; background:var(--ph); cursor:pointer; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb[aria-current="true"] { border-color:var(--accent); }
.info { padding:28px 28px 28px 12px; min-width:0; display:flex; flex-direction:column; gap:6px; }
.info h2 { font-family:var(--display); font-size:1.7rem; line-height:1.3; margin:0; padding-right:40px; overflow-wrap:anywhere; }
.info .price { font-size:1.25rem; }
.spec { margin:14px 0 4px; border-top:1px solid var(--line); }
.spec > div { display:grid; grid-template-columns:8.5em minmax(0, 1fr); gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.spec dt { color:var(--muted); font-size:.86rem; padding-top:1px; }
.spec dd { margin:0; }
.desc h3 { font-size:.86rem; color:var(--muted); font-weight:500; margin:14px 0 4px; letter-spacing:.04em; }
.desc p { margin:0; }
.ask { margin:16px 0 0; padding:12px 14px; background:var(--accent-soft); border-radius:8px; font-size:.92rem; overflow-wrap:anywhere; }
.owner-tools { margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.confirm { flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.9rem; }

/* 입력 양식 */
.form { padding:26px 24px 22px; display:flex; flex-direction:column; gap:16px; max-width:720px; margin:0 auto; }
.form h2 { font-family:var(--display); font-size:1.5rem; margin:0; padding-right:44px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > label, .field .lbl { font-weight:600; font-size:.9rem; }
.field small { font-weight:400; color:var(--muted); }
.field input[type=text], .field textarea { font:inherit; font-size:16px; width:100%; padding:10px 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--bg); color:var(--ink); }
.field textarea { resize:vertical; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.photo-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; }
.pitem { position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--ph); max-width:100%; }
.pitem img { width:100%; height:100%; object-fit:cover; display:block; }
.pitem .first { position:absolute; top:6px; left:6px; font-size:.7rem; background:var(--accent); color:var(--accent-ink); padding:0 7px; border-radius:999px; }
.pitem .ptools { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; background:var(--chip-bg); }
.pitem .ptools button { flex:1; border:0; background:none; color:var(--chip-ink); padding:5px 0; cursor:pointer; font-size:.85rem; }
.pitem .ptools button:disabled { opacity:.3; cursor:default; }
.drop { display:block; border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
.hint { margin:0; font-size:.86rem; color:var(--muted); min-height:1.2em; }
.msg { margin:0; font-size:.9rem; color:var(--danger); min-height:1.2em; }
.msg.ok { color:var(--accent-text); }
.form-actions { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }

/* 알림 */
.toast { position:fixed; left:50%; bottom:max(20px, env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60;
  background:var(--ink); color:var(--surface); padding:10px 18px; border-radius:999px; font-size:.9rem; max-width:calc(100% - 32px); text-align:center; }

@media (max-width: 760px) {
  .detail { grid-template-columns:minmax(0, 1fr); }
  .gal { padding:12px 12px 0; }
  .info { padding:16px 18px 24px; }
  .info h2 { font-size:1.45rem; padding-right:0; }
  .row2 { grid-template-columns:minmax(0, 1fr); }
  .form { padding:22px 16px 18px; }
  .spec > div { grid-template-columns:minmax(0, 1fr); gap:2px; }
  .veil { padding:8px; }
}
</style>
</head>

<script id="app-script">
(function () {
  // =====================================================================
  //  제작 샘플 갤러리
  //  · 내 컴퓨터에서 이 파일을 열면(file://) 편집 화면이 나와요.
  //  · 배포된 주소(https://)로 열면 손님용 보기 화면만 나와요.
  //  · [파일에 저장]을 누르면 사진과 내용이 모두 들어간 index.html 로 저장돼요.
  // =====================================================================
  const SCRIPT_TEXT = document.currentScript.textContent;
  const STYLE_TEXT = document.getElementById('app-style').textContent;
  const PAGE_TITLE = '제작 샘플 갤러리';
  const FONT_HREF = 'https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap';

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function readState() {
    try {
      const s = JSON.parse(document.getElementById('app-data').textContent);
      if (s && s.site && Array.isArray(s.items)) return s;
    } catch (e) {}
    return { site: { title: PAGE_TITLE, intro: '', contact: '', kakaoName: '', kakaoUrl: '' }, items: [] };
  }
  // 지금 내용으로 index.html 파일 전체를 다시 만들어요.
  function buildDocument(s) {
    const json = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + '<title>' + esc(s.site.title || PAGE_TITLE) + '</title>\n'
      + '<link rel="stylesheet" href="' + FONT_HREF + '">\n'
      + '<style id="app-style">' + STYLE_TEXT + '</style>\n'
      + '</head>\n<body>\n<div id="app"></div>\n'
      + '<script type="application/json" id="app-data">' + json + '<\/script>\n'
      + '<script id="app-script">' + SCRIPT_TEXT + '<\/script>\n'
      + '</body>\n</html>\n';
  }

  let state = readState();
  document.title = state.site.title || PAGE_TITLE;
  const canEdit = location.protocol === 'file:';   // 내 컴퓨터에서 연 경우에만 편집
  let preview = false;                                // '손님 화면 보기'
  let dirty = false;                                  // 파일에 아직 저장하지 않은 변경이 있는지
  let fileHandle = null;                              // 한 번 고른 저장 위치(같은 창에서 계속 사용)
  const editing = () => canEdit && !preview;

  const app = document.getElementById('app');
  const photoUrl = p => String(p);
  const byId = id => state.items.find(it => it.id === id);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- 카카오톡 채널 ----------
  const BUBBLE = '<svg class="bubble" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7L5.7 21l3.9-2.6c.8.1 1.6.2 2.4.2 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>';
  const safeKakaoUrl = u => /^https:\/\/([a-z0-9-]+\.)*kakao\.com\//i.test(String(u || '').trim()) ? String(u).trim() : '';
  function kakaoHtml() {
    const s = state.site, name = (s.kakaoName || '').trim(), url = safeKakaoUrl(s.kakaoUrl);
    if (!name && !url) return '';
    if (url) return `<p class="kakao-row"><a class="kakao" href="${esc(url)}" target="_blank" rel="noopener">${BUBBLE}카카오톡 채널 ${name ? `'${esc(name)}'` : ''}로 문의하기</a></p>`;
    return `<p class="kakao-row"><span class="kakao">${BUBBLE}카카오톡에서 '${esc(name)}' 채널 검색</span>
      <button class="btn tiny" type="button" data-action="copy-kakao">채널 이름 복사</button></p>
      ${editing() ? `<p class="owner-note">'가게 정보 수정'에 채널 주소(pf.kakao.com/…)를 넣으면 누르자마자 채널로 연결돼요.</p>` : ''}`;
  }

  // ---------- 목록 화면 ----------
  function render() {
    const s = state.site, ed = editing();
    const bar = canEdit ? `
      <div class="editbar"><div class="wrap editbar-in">
        <span class="mode">${ed ? '<b>편집 화면</b> · 내 컴퓨터에서만 보여요' : '<b>손님 화면</b>으로 보는 중'}
          · ${dirty ? '<span class="dirty">저장 안 된 변경이 있어요</span>' : '<span class="clean">파일에 저장됨</span>'}</span>
        <div class="editbar-actions">
          ${ed ? '<button class="btn" type="button" data-action="site">가게 정보 수정</button><button class="btn" type="button" data-action="new">+ 샘플 추가</button>' : ''}
          <button class="btn ghost" type="button" data-action="preview">${ed ? '손님 화면 보기' : '편집으로 돌아가기'}</button>
          <button class="btn primary" type="button" data-action="save-file">파일에 저장</button>
        </div>
      </div></div>` : '';
    const items = state.items;
    const list = items.length
      ? `<div class="grid">${items.map(card).join('')}</div>`
      : `<div class="empty">${ed
          ? '아직 샘플이 없어요. 사진과 설명을 넣어 첫 샘플을 추가해 보세요.<br><button class="btn primary" type="button" data-action="new">+ 샘플 추가</button>'
          : '아직 등록된 샘플이 없어요.'}</div>`;
    app.innerHTML = `${bar}
      <header class="top wrap">
        <h1>${esc(s.title || PAGE_TITLE)}</h1>
        ${s.intro ? `<p class="intro pre">${esc(s.intro)}</p>` : ''}
        ${s.contact ? `<p class="contact"><span class="k">문의</span><span class="v" id="contact-text">${esc(s.contact)}</span>
          <button class="btn tiny" type="button" data-action="copy-contact">복사</button></p>` : ''}
        ${kakaoHtml()}
      </header>
      <main class="wrap">
        ${items.length ? `<div class="count">샘플 ${items.length}개</div>` : ''}
        ${list}
      </main>`;
  }
  function card(it, i) {
    const cover = it.photos && it.photos[0];
    return `<article class="card">
      <button class="card-hit" type="button" data-action="open" data-id="${esc(it.id)}">
        <div class="ph">
          ${cover ? `<img src="${esc(photoUrl(cover))}" alt="${esc(it.name)} 대표 사진" loading="lazy">` : '<span class="noph">사진 없음</span>'}
          ${it.photos.length > 1 ? `<span class="badge">사진 ${it.photos.length}장</span>` : ''}
        </div>
        <div class="cbody">
          <h2>${esc(it.name || '이름 없음')}</h2>
          <p class="price">${esc(it.price || '가격 문의')}</p>
          ${it.period ? `<p class="period">제작기간 ${esc(it.period)}</p>` : ''}
        </div>
      </button>
      ${editing() ? `<div class="card-tools">
          <button class="btn tiny" type="button" data-action="move-up" data-id="${esc(it.id)}" aria-label="앞으로 옮기기" ${i === 0 ? 'disabled' : ''}>←</button>
          <button class="btn tiny" type="button" data-action="move-down" data-id="${esc(it.id)}" aria-label="뒤로 옮기기" ${i === state.items.length - 1 ? 'disabled' : ''}>→</button>
          <button class="btn tiny" type="button" data-action="edit" data-id="${esc(it.id)}">수정</button>
        </div>` : ''}
    </article>`;
  }

  // 사진을 불러오지 못하면 자리 표시로 바꿔요.
  document.addEventListener('error', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.closest('#app, .veil')) {
      const span = document.createElement('span');
      span.className = 'noph';
      span.textContent = '사진을 불러오지 못했어요';
      t.replaceWith(span);
    }
  }, true);

  // ---------- 알림 ----------
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.hidden = true;
  toast.setAttribute('role', 'status');
  document.body.appendChild(toast);
  let toastTimer = 0;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
  }

  // ---------- 창(상세 / 입력) ----------
  const veil = document.createElement('div');
  veil.className = 'veil';
  veil.hidden = true;
  veil.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="m-title" tabindex="-1"></div>';
  document.body.appendChild(veil);
  const panel = veil.firstChild;
  let modal = null, lastFocus = null;

  function openModal(html, info) {
    if (veil.hidden) lastFocus = document.activeElement;
    modal = info;
    panel.innerHTML = '<button class="x-close" type="button" data-action="close" aria-label="닫기">✕</button>' + html;
    veil.hidden = false;
    document.documentElement.classList.add('locked');
    panel.scrollTop = 0;
    panel.focus();
  }
  function closeModal() {
    if (modal && modal.type === 'edit' && modal.uploading) return;
    veil.hidden = true;
    modal = null;
    panel.innerHTML = '';
    document.documentElement.classList.remove('locked');
    if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // 상세 보기
  function openDetail(id, idx) {
    const it = byId(id);
    if (!it) return;
    openModal(detailHtml(it), { type: 'detail', id, idx: 0 });
    setGal(idx || 0);
    if (location.hash !== '#s-' + id) { try { history.replaceState(null, '', '#s-' + id); } catch (e) {} }
  }
  function detailHtml(it) {
    const n = it.photos.length, c = state.site.contact;
    const stage = n
      ? `<img id="gal-img" src="${esc(photoUrl(it.photos[0]))}" alt="">
         ${n > 1 ? `<button class="nav prev" type="button" data-action="gal-prev" aria-label="이전 사진">‹</button>
           <button class="nav next" type="button" data-action="gal-next" aria-label="다음 사진">›</button>
           <span class="counter" id="gal-count"></span>` : ''}`
      : '<span class="noph">사진 없음</span>';
    const thumbs = n > 1
      ? `<div class="thumbs">${it.photos.map((p, i) =>
          `<button class="thumb" type="button" data-action="gal-go" data-i="${i}" aria-label="${i + 1}번째 사진"><img src="${esc(photoUrl(p))}" alt="" loading="lazy"></button>`).join('')}</div>`
      : '';
    return `<div class="detail">
      <div class="gal"><div class="stage">${stage}</div>${thumbs}</div>
      <div class="info">
        <h2 id="m-title">${esc(it.name || '이름 없음')}</h2>
        <p class="price">${esc(it.price || '가격 문의')}</p>
        <dl class="spec">
          <div><dt>제작기간</dt><dd class="pre">${esc(it.period || '문의해 주세요')}</dd></div>
          <div><dt>제작 시 필요 사항</dt><dd class="pre">${esc(it.needs || '-')}</dd></div>
        </dl>
        ${it.desc ? `<div class="desc"><h3>내용</h3><p class="pre">${esc(it.desc)}</p></div>` : ''}
        ${c ? `<p class="ask">주문·문의: <b>${esc(c)}</b></p>` : ''}
        ${kakaoHtml()}
        ${editing() ? `<div class="owner-tools">
            <button class="btn" type="button" data-action="edit" data-id="${esc(it.id)}">수정</button>
            <button class="btn danger" type="button" data-action="ask-delete">삭제</button>
            <div class="confirm" id="del-confirm" hidden>
              <span>이 샘플을 지울까요?</span>
              <button class="btn danger solid" type="button" data-action="delete" data-id="${esc(it.id)}">지우기</button>
              <button class="btn ghost" type="button" data-action="cancel-delete">취소</button>
            </div>
          </div>` : ''}
      </div>
    </div>`;
  }
  function setGal(i) {
    if (!modal || modal.type !== 'detail') return;
    const it = byId(modal.id);
    const n = it ? it.photos.length : 0;
    if (!n) return;
    modal.idx = ((i % n) + n) % n;
    const img = document.getElementById('gal-img');
    if (img) { img.src = photoUrl(it.photos[modal.idx]); img.alt = `${it.name} 사진 ${modal.idx + 1}/${n}`; }
    const cnt = document.getElementById('gal-count');
    if (cnt) cnt.textContent = `${modal.idx + 1} / ${n}`;
    panel.querySelectorAll('.thumb').forEach((t, k) => t.setAttribute('aria-current', String(k === modal.idx)));
  }
  function openFromHash() {
    const m = location.hash.match(/^#s-([A-Za-z0-9]+)$/);
    if (m && byId(m[1])) { if (!modal || modal.id !== m[1]) openDetail(m[1]); }
    else if (modal && modal.type === 'detail') closeModal();
  }

  // ---------- 바뀐 내용 적용 ----------
  function commit(next, text) {
    state = next;
    dirty = true;
    document.title = state.site.title || PAGE_TITLE;
    closeModal();
    render();
    showToast(text + ' · [파일에 저장]을 눌러야 파일에 남아요');
  }

  // 샘플 입력 양식
  function openEdit(id) {
    const it = id ? byId(id) : null;
    const d = it || { name: '', price: '', period: '', needs: '', desc: '', photos: [] };
    openModal(`<form class="form" id="edit-form" novalidate>
      <h2 id="m-title">${it ? '샘플 수정' : '새 샘플 추가'}</h2>
      <div class="field">
        <span class="lbl">사진 <small>여러 장 넣을 수 있어요 · 첫 번째 사진이 대표 사진이에요</small></span>
        <div class="photo-list" id="f-photo-list"></div>
        <label class="drop" id="f-drop" for="f-photos">사진 고르기 (또는 여기로 끌어 놓기)
          <input class="sr-only" type="file" id="f-photos" accept="image/*" multiple>
        </label>
        <p class="hint" id="f-upload-msg" role="status"></p>
      </div>
      <div class="field"><label for="f-name">상품명</label>
        <input type="text" id="f-name" maxlength="60" value="${esc(d.name)}" placeholder="예: 여권지갑" required></div>
      <div class="row2">
        <div class="field"><label for="f-price">가격</label>
          <input type="text" id="f-price" maxlength="40" value="${esc(d.price)}" placeholder="예: 15,000원 / 10,000원부터"></div>
        <div class="field"><label for="f-period">제작기간</label>
          <input type="text" id="f-period" maxlength="40" value="${esc(d.period)}" placeholder="예: 주문 후 7~10일"></div>
      </div>
      <div class="field"><label for="f-needs">제작 시 필요 사항</label>
        <textarea id="f-needs" rows="3" maxlength="600" placeholder="예: 원하는 문구, 이미지, 수량, 받는 날짜">${esc(d.needs)}</textarea></div>
      <div class="field"><label for="f-desc">내용</label>
        <textarea id="f-desc" rows="5" maxlength="2000" placeholder="재료, 크기, 특징 등 자세한 설명">${esc(d.desc)}</textarea></div>
      <p class="msg" id="f-msg" role="status"></p>
      <div class="form-actions">
        <button class="btn ghost" type="button" data-action="close">취소</button>
        <button class="btn primary" type="submit" id="f-save">적용하기</button>
      </div>
    </form>`, { type: 'edit', id: it ? it.id : null, photos: d.photos.slice(), uploading: 0 });

    renderDraftPhotos();
    document.getElementById('edit-form').addEventListener('submit', saveItem);
    document.getElementById('f-photos').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
    const drop = document.getElementById('f-drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
  }
  function renderDraftPhotos() {
    const box = document.getElementById('f-photo-list');
    if (!box || !modal) return;
    const ps = modal.photos, n = ps.length;
    box.innerHTML = ps.map((p, i) => `<div class="pitem">
      <img src="${esc(photoUrl(p))}" alt="${i + 1}번째 사진">
      ${i === 0 ? '<span class="first">대표</span>' : ''}
      <div class="ptools">
        <button type="button" data-action="ph-left" data-i="${i}" aria-label="앞으로" ${i === 0 ? 'disabled' : ''}>←</button>
        <button type="button" data-action="ph-del" data-i="${i}" aria-label="이 사진 빼기">✕</button>
        <button type="button" data-action="ph-right" data-i="${i}" aria-label="뒤로" ${i === n - 1 ? 'disabled' : ''}>→</button>
      </div></div>`).join('');
  }

  // 사진은 긴 변 1600px 의 JPG 로 줄여서 파일 안에 넣어요. (사이트가 빨리 열리게)
  async function prepareImage(file) {
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch (e) { throw new Error('열 수 없는 사진 형식이에요. JPG나 PNG로 바꿔서 올려 주세요.'); }
    const MAX = 1600, scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return cv.toDataURL('image/jpeg', 0.82);
  }
  async function addFiles(fileList) {
    const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    if (!files.length || !modal || modal.type !== 'edit') return;
    const msg = document.getElementById('f-upload-msg'), save = document.getElementById('f-save');
    const m = modal;
    m.uploading++;
    save.disabled = true;
    const errors = [];
    for (let i = 0; i < files.length; i++) {
      if (modal !== m) break;
      msg.textContent = `사진 넣는 중… (${i + 1}/${files.length})`;
      try { m.photos.push(await prepareImage(files[i])); renderDraftPhotos(); }
      catch (err) { errors.push(`${files[i].name}: ${err.message}`); }
    }
    m.uploading--;
    if (modal === m) {
      if (!m.uploading) save.disabled = false;
      msg.textContent = errors.length ? errors.join(' / ') : '사진을 넣었어요. 다 됐으면 적용하기를 눌러 주세요.';
    }
  }
  function saveItem(e) {
    e.preventDefault();
    const m = modal, msg = document.getElementById('f-msg');
    if (m.uploading) { msg.textContent = '사진을 다 넣은 다음 눌러 주세요.'; return; }
    const v = id => document.getElementById(id).value.trim();
    const name = v('f-name');
    if (!name) { msg.textContent = '상품명을 입력해 주세요.'; document.getElementById('f-name').focus(); return; }
    const item = { id: m.id || newId(), name, price: v('f-price'), period: v('f-period'),
      needs: v('f-needs'), desc: v('f-desc'), photos: m.photos.slice() };
    const items = state.items.slice();
    const at = items.findIndex(x => x.id === item.id);
    if (at >= 0) items[at] = item; else items.unshift(item);
    commit({ site: state.site, items }, m.id ? '샘플을 고쳤어요' : '샘플을 추가했어요');
  }

  // 가게 정보 양식
  function openSite() {
    const s = state.site;
    openModal(`<form class="form" id="site-form" novalidate>
      <h2 id="m-title">가게 정보 수정</h2>
      <div class="field"><label for="s-title">사이트 제목</label>
        <input type="text" id="s-title" maxlength="40" value="${esc(s.title)}" placeholder="예: 맹글다굿즈 제작 샘플"></div>
      <div class="field"><label for="s-intro">소개 글</label>
        <textarea id="s-intro" rows="3" maxlength="300" placeholder="손님에게 보여줄 짧은 소개">${esc(s.intro)}</textarea></div>
      <div class="field"><label for="s-contact">다른 문의 방법 <small>전화번호, 인스타그램 등 (없으면 비워 두세요)</small></label>
        <input type="text" id="s-contact" maxlength="80" value="${esc(s.contact)}" placeholder="예: 010-1234-5678"></div>
      <div class="row2">
        <div class="field"><label for="s-kakao-name">카카오톡 채널 이름</label>
          <input type="text" id="s-kakao-name" maxlength="40" value="${esc(s.kakaoName || '')}" placeholder="예: 맹글다굿즈"></div>
        <div class="field"><label for="s-kakao-url">카카오톡 채널 주소 <small>pf.kakao.com/… 으로 시작</small></label>
          <input type="text" id="s-kakao-url" maxlength="200" value="${esc(s.kakaoUrl || '')}" placeholder="https://pf.kakao.com/_xxxxx/chat"></div>
      </div>
      <p class="msg" id="s-msg" role="status"></p>
      <div class="form-actions">
        <button class="btn ghost" type="button" data-action="close">취소</button>
        <button class="btn primary" type="submit">적용하기</button>
      </div>
    </form>`, { type: 'site' });
    document.getElementById('site-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      let kakaoUrl = v('s-kakao-url');
      if (kakaoUrl && !/^https?:\/\//i.test(kakaoUrl)) kakaoUrl = 'https://' + kakaoUrl;
      kakaoUrl = kakaoUrl.replace(/^http:\/\//i, 'https://');
      if (kakaoUrl && !safeKakaoUrl(kakaoUrl)) {
        document.getElementById('s-msg').textContent = '카카오톡 채널 주소는 https://pf.kakao.com/ 으로 시작해야 해요.';
        document.getElementById('s-kakao-url').focus();
        return;
      }
      const site = { title: v('s-title') || PAGE_TITLE, intro: v('s-intro'), contact: v('s-contact'),
        kakaoName: v('s-kakao-name'), kakaoUrl };
      commit({ site, items: state.items }, '가게 정보를 고쳤어요');
    });
  }

  // ---------- 파일에 저장 ----------
  async function saveFile() {
    const html = buildDocument(state);
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle) {
          showToast('저장할 곳을 고르는 창이 열려요. 원래 index.html 을 골라 덮어쓰세요');
          fileHandle = await window.showSaveFilePicker({
            suggestedName: 'index.html',
            types: [{ description: 'HTML 파일', accept: { 'text/html': ['.html'] } }]
          });
        }
        const w = await fileHandle.createWritable();
        await w.write(new Blob([html], { type: 'text/html' }));
        await w.close();
        dirty = false; render();
        showToast(`'${fileHandle.name}' 에 저장했어요`);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') { showToast('저장을 취소했어요'); return; }
        fileHandle = null;   // 아래 내려받기 방식으로 저장
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    dirty = false; render();
    showToast('다운로드 폴더에 index.html 로 저장했어요. 사이트 폴더의 파일과 바꿔 주세요');
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- 클릭 처리 ----------
  document.addEventListener('click', async e => {
    if (e.target === veil) { closeModal(); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action, id = el.dataset.id, i = Number(el.dataset.i);
    if (a === 'open') openDetail(id);
    else if (a === 'close') closeModal();
    else if (a === 'gal-prev') setGal(modal.idx - 1);
    else if (a === 'gal-next') setGal(modal.idx + 1);
    else if (a === 'gal-go') setGal(i);
    else if (a === 'preview') { preview = !preview; render(); }
    else if (a === 'save-file' && canEdit) saveFile();
    else if (a === 'new' && editing()) openEdit(null);
    else if (a === 'edit' && editing()) openEdit(id);
    else if (a === 'site' && editing()) openSite();
    else if ((a === 'move-up' || a === 'move-down') && editing()) {
      const items = state.items.slice(), k = items.findIndex(x => x.id === id), j = a === 'move-up' ? k - 1 : k + 1;
      if (k < 0 || j < 0 || j >= items.length) return;
      [items[k], items[j]] = [items[j], items[k]];
      state = { site: state.site, items }; dirty = true; render();
    }
    else if (a === 'ask-delete') { document.getElementById('del-confirm').hidden = false; }
    else if (a === 'cancel-delete') { document.getElementById('del-confirm').hidden = true; }
    else if (a === 'delete' && editing()) {
      commit({ site: state.site, items: state.items.filter(x => x.id !== id) }, '샘플을 지웠어요');
    }
    else if (a === 'ph-left' || a === 'ph-right' || a === 'ph-del') {
      const ps = modal.photos;
      if (a === 'ph-del') ps.splice(i, 1);
      else { const j = a === 'ph-left' ? i - 1 : i + 1; [ps[i], ps[j]] = [ps[j], ps[i]]; }
      renderDraftPhotos();
    }
    else if (a === 'copy-kakao' || a === 'copy-contact') {
      const text = a === 'copy-kakao' ? state.site.kakaoName : state.site.contact;
      const label = el.textContent;
      try { await navigator.clipboard.writeText(text); el.textContent = '복사했어요'; }
      catch (err) { el.textContent = text; }
      setTimeout(() => { el.textContent = label; }, 2000);
    }
  });
  document.addEventListener('keydown', e => {
    if (veil.hidden) return;
    if (e.key === 'Escape') closeModal();
    else if (modal && modal.type === 'detail' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      if (e.key === 'ArrowLeft') setGal(modal.idx - 1);
      if (e.key === 'ArrowRight') setGal(modal.idx + 1);
    }
  });
  window.addEventListener('hashchange', openFromHash);

  // ---------- 시작 ----------
  render();
  openFromHash();
})();
</script>
</body>
</html>
